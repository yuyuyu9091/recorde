<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#22306A">
  <meta name="mobile-web-app-capable" content="yes">
  <title>목소리 책장</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ───────── 아이 화면: 책장 ───────── -->
  <section id="shelf" class="screen kid">
    <header class="shelf-top">
      <h1 class="brand">목소리 책장</h1>
      <button id="parentHold" class="hold-btn" type="button" aria-label="부모 화면 (3초 길게 누르기)">
        <svg class="hold-ring" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/></svg>
        <svg class="hold-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none"/></svg>
      </button>
    </header>
    <div id="shelfGrid" class="shelf-grid"></div>
    <div id="shelfEmpty" class="shelf-empty" hidden>
      <p class="empty-title">책장이 비어 있어요</p>
      <p>오른쪽 위 자물쇠를 3초 동안 꾹 누르면 부모 화면이 열려요.<br>거기서 표지를 찍고 녹음하면 이곳에 책이 꽂혀요.</p>
    </div>
  </section>

  <!-- ───────── 아이 화면: 듣기 ───────── -->
  <section id="player" class="screen kid" hidden>
    <button id="homeBtn" class="round home-btn" type="button" aria-label="책장으로">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>
    </button>

    <div id="stage" class="stage">
      <button id="coverBtn" class="cover-btn" type="button" aria-label="재생 또는 멈춤">
        <img id="playerCover" alt="" draggable="false">
      </button>
      <div class="ding-fx" aria-hidden="true">
        <span class="ding-ring"></span>
        <svg class="ding-bell" viewBox="0 0 24 24"><path d="M12 3a1.5 1.5 0 0 1 1.5 1.5v.6A6 6 0 0 1 18 11v4l2 2.5H4L6 15v-4a6 6 0 0 1 4.5-5.9v-.6A1.5 1.5 0 0 1 12 3z"/><path d="M9.5 19.5a2.5 2.5 0 0 0 5 0z"/></svg>
      </div>
      <div class="end-fx" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>
      </div>
    </div>

    <div class="player-bottom">
      <div id="pageDots" class="page-dots" aria-hidden="true"></div>
      <div id="progress" class="progress" aria-hidden="true"><div id="progressFill"></div></div>
      <div class="controls">
        <button id="restartBtn" class="round ctrl-small" type="button" aria-label="처음부터">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="2.6" height="14" rx="1"/><path d="M19 5.6v12.8a.8.8 0 0 1-1.2.7L8.6 12.7a.8.8 0 0 1 0-1.4l9.2-6.4a.8.8 0 0 1 1.2.7z"/></svg>
        </button>
        <button id="playBtn" class="round ctrl-play" type="button" aria-label="재생" data-state="paused">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
        </button>
        <button id="backBtn" class="round ctrl-small" type="button" aria-label="10초 뒤로">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6a7 7 0 1 1-7 7M14.6 3.4 12 6l2.6 2.6" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="15.6" text-anchor="middle">10</text></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ───────── 부모 화면: 책 관리 ───────── -->
  <section id="parent" class="screen parent" hidden>
    <header class="p-top">
      <h2>부모 화면</h2>
      <button id="toKidBtn" class="btn" type="button">아이 화면으로</button>
    </header>
    <div class="p-body">
      <section class="p-section">
        <div class="p-head">
          <h3>책 <span id="bookCount" class="count"></span></h3>
          <button id="addBookBtn" class="btn primary" type="button">새 책 추가</button>
        </div>
        <p class="muted">책장에는 이 순서대로 꽂혀요. 화살표로 순서를 바꿀 수 있어요.</p>
        <ol id="bookList" class="book-list"></ol>
      </section>

      <section class="p-section">
        <h3>백업</h3>
        <p id="backupStatus" class="backup-status"></p>
        <div class="row">
          <button id="exportBtn" class="btn primary" type="button">백업 파일 만들기</button>
          <label class="btn">백업 불러오기<input id="importInput" type="file" accept=".zip,application/zip" hidden></label>
        </div>
        <p id="storageInfo" class="muted"></p>
      </section>

      <section class="p-section">
        <h3>설정</h3>
        <div class="setting">
          <label for="chimeVolume">띵 소리 크기</label>
          <input id="chimeVolume" type="range" min="0" max="1" step="0.1">
          <button id="chimeTest" class="btn small" type="button">들어보기</button>
        </div>
        <div class="setting">
          <span>부모 화면 비밀번호</span>
          <button id="changePinBtn" class="btn small" type="button">비밀번호 바꾸기</button>
        </div>
      </section>
      <p id="versionInfo" class="muted version"></p>
    </div>
  </section>

  <!-- ───────── 부모 화면: 책 추가·수정 ───────── -->
  <section id="editor" class="screen parent" hidden>
    <header class="p-top">
      <button id="editorBackBtn" class="btn" type="button">목록으로</button>
      <h2 id="editorTitle">새 책</h2>
      <button id="saveBtn" class="btn primary" type="button">저장</button>
    </header>
    <div class="p-body editor-body">
      <div class="editor-cover">
        <div id="coverEmpty" class="cover-empty">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.4-2h5.8l1.4 2h2.2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke-width="1.6"/><circle cx="12" cy="12.8" r="3.4" fill="none" stroke-width="1.6"/></svg>
          <span>표지 사진이 필요해요</span>
        </div>
        <img id="coverPreview" alt="표지 미리보기" hidden>
        <div class="row">
          <label class="btn primary">사진 찍기<input id="coverCamera" type="file" accept="image/*" capture="environment" hidden></label>
          <label class="btn">앨범에서 고르기<input id="coverAlbum" type="file" accept="image/*" hidden></label>
        </div>
      </div>

      <div class="editor-fields">
        <label class="field">
          <span>책 이름 <small>부모 화면에서만 보여요</small></span>
          <input id="titleInput" type="text" maxlength="60" placeholder="예: 구름빵" autocomplete="off">
        </label>

        <div class="rec-box">
          <h3>녹음</h3>
          <p id="recSummary" class="rec-summary"></p>
          <div class="row">
            <button id="recordBtn" class="btn rec" type="button">녹음 시작</button>
            <button id="previewBtn" class="btn" type="button" hidden>들어보기</button>
          </div>
          <p id="previewTime" class="muted" hidden></p>
          <p class="muted">책을 펼쳐 놓고 읽으면서, 책장을 넘길 때마다 화면의 큰 버튼을 눌러 주세요. 아이가 들을 때 그 자리에서 띵 소리가 나요.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ───────── 녹음 중 화면 ───────── -->
  <div id="recOverlay" class="overlay rec-overlay" hidden>
    <div class="rec-top">
      <span id="recDot" class="rec-dot" aria-hidden="true"></span>
      <span id="recState" class="rec-state">녹음 중</span>
      <span id="recTime" class="rec-time">0:00</span>
    </div>
    <div class="meter" aria-hidden="true"><div id="recLevel"></div></div>
    <button id="markBtn" class="mark-btn" type="button">
      <span class="mark-label">책장 넘김</span>
      <span id="markCount" class="mark-count">아직 0번</span>
    </button>
    <div class="rec-actions">
      <button id="undoMarkBtn" class="btn ghost" type="button">방금 넘김 취소</button>
      <button id="pauseRecBtn" class="btn ghost" type="button">일시정지</button>
      <button id="discardRecBtn" class="btn ghost" type="button">녹음 버리기</button>
      <button id="stopRecBtn" class="btn lamp" type="button">녹음 끝</button>
    </div>
  </div>

  <!-- ───────── 비밀번호 ───────── -->
  <div id="pinOverlay" class="overlay pin-overlay" hidden>
    <div class="pin-card">
      <h2 id="pinTitle">비밀번호</h2>
      <p id="pinHint" class="pin-hint"></p>
      <div id="pinDots" class="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="pinPad" class="pin-pad">
        <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
        <button type="button" data-key="cancel" class="pin-text">취소</button><button type="button" data-key="0">0</button><button type="button" data-key="del" class="pin-text" aria-label="지우기">지우기</button>
      </div>
      <button id="pinForgot" class="link" type="button">비밀번호를 잊었어요</button>
    </div>
  </div>

  <!-- ───────── 알림창 ───────── -->
  <div id="modal" class="overlay modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <p id="modalText"></p>
      <input id="modalInput" type="text" inputmode="numeric" autocomplete="off" hidden>
      <div id="modalActions" class="row end"></div>
    </div>
  </div>

  <div id="busy" class="overlay busy" hidden>
    <div class="modal-card">
      <p id="busyText"></p>
      <div class="bar"><div id="busyFill"></div></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
